<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte de vœux 2027 — Préfecture de Colmar (WebAR)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
  <script>
    AFRAME.registerComponent('star-glow', {
      init: function () {
        this.starMaterials = [];
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              const mats = Array.isArray(node.material) ? node.material : [node.material];
              const nodeName = (node.name || '').toLowerCase();
              mats.forEach((mat) => {
                const matName = (mat.name || '').toLowerCase();
                if (
                  nodeName.includes('star') ||
                  nodeName.includes('cigogne') ||
                  matName.includes('star') ||
                  matName.includes('cigogne')
                ) {
                  mat.emissive = new THREE.Color(0xffe07d);
                  mat.emissiveIntensity = 1.4;
                  mat.needsUpdate = true;
                  this.starMaterials.push(mat);
                }
              });
            }
          });
        });
      },
      tick: function (time) {
        if (!this.starMaterials.length) return;
        const pulse = 1.25 + 0.75 * Math.sin(time * 0.004);
        this.starMaterials.forEach((mat) => {
          mat.emissiveIntensity = pulse;
        });
      }
    });
  </script>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./ARtargetImage.mind; maxTrack: 1; filterMinCF: 0.00001; filterBeta: 0.2; warmupTolerance: 8; missTolerance: 15;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    device-orientation-permission-ui="enabled: false"
    vr-mode-ui="enabled: false"
    id="scene"
  >
    <a-assets>
      <a-asset-item id="CarteModel" response-type="arraybuffer" src="./Carte-de-voeux.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="CarteVoeux2027"
        src="#CarteModel"
        animation-mixer="loop: repeat"
        star-glow
        position="0 0 0.08"
        rotation="90 0 0"
        scale="0.72 0.72 0.72"
      ></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
